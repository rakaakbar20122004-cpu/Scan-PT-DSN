<script>
  // --- APP STATE & STORAGE ---
  const DB_KEY = "dsn_scan_database_v2";
  let database = JSON.parse(localStorage.getItem(DB_KEY)) || [];

  let isScanning = false;
  let codeReader = null;
  let currentFacingMode = "environment";
  let isTorchOn = false;

  function saveDatabase() {
    localStorage.setItem(DB_KEY, JSON.stringify(database));
  }

  // --- TAB SWITCHING ---
  function switchTab(viewId, navId) {
    document
      .querySelectorAll(".view-page")
      .forEach((v) => v.classList.remove("active"));
    document
      .querySelectorAll(".nav-item")
      .forEach((n) => n.classList.remove("active"));

    document.getElementById(viewId).classList.add("active");
    document.getElementById(navId).classList.add("active");

    if (viewId === "view-session") renderTodaySession();
    if (viewId === "view-database") renderDatabase();
  }

  // --- PARSER BARCODE LOGIC ---
  function parseBarcodeData(rawText) {
    const clean = rawText.trim();
    const now = new Date();
    const dateStr = now.toISOString().split("T")[0];
    const timeStr = now.toTimeString().split(" ")[0];

    // BARCODE TYPE 1: Standard Comma-separated (Gol, P, L, Pot, M2)
    if (clean.includes(",")) {
      const parts = clean.split(",").map((s) => s.trim());
      if (parts.length >= 5) {
        return {
          id: Date.now() + Math.random(),
          type: 1,
          raw: clean,
          gol: parts[0],
          p: parts[1],
          l: parts[2],
          pot: parts[3],
          m2: parts[4],
          date: dateStr,
          time: timeStr,
        };
      }
    }

    // BARCODE TYPE 2: Contains LEN, WIDE, SHT, SM
    if (
      clean.includes("LEN") ||
      clean.includes("WIDE") ||
      clean.includes("SHT")
    ) {
      const getVal = (key) => {
        const match = clean.match(new RegExp(`${key}\\s*([0-9.]+)`));
        return match ? match[1] : "-";
      };
      const golMatch = clean.match(/^([^\s]+)/);

      return {
        id: Date.now() + Math.random(),
        type: 2,
        raw: clean,
        gol: golMatch ? golMatch[1] : clean.substring(0, 10),
        len: getVal("LEN"),
        wide: getVal("WIDE"),
        sht: getVal("SHT"),
        sm: getVal("SM"),
        date: dateStr,
        time: timeStr,
      };
    }

    // BARCODE TYPE 3: Contains LEN, WIDE, PCS
    if (clean.includes("PCS")) {
      const getVal = (key) => {
        const match = clean.match(new RegExp(`${key}\\s*([0-9.]+)`));
        return match ? match[1] : "-";
      };
      const golMatch = clean.match(/^([^\s]+)/);
      const len = getVal("LEN");
      const wide = getVal("WIDE");
      const pcs = getVal("PCS");

      let m2 = "-";
      if (len !== "-" && wide !== "-" && pcs !== "-") {
        m2 = (
          (parseFloat(len) * parseFloat(wide) * parseFloat(pcs)) /
          1000000
        ).toFixed(2);
      }

      return {
        id: Date.now() + Math.random(),
        type: 3,
        raw: clean,
        gol: golMatch ? golMatch[1] : clean.substring(0, 10),
        len: len,
        wide: wide,
        pcs: pcs,
        m2: m2,
        date: dateStr,
        time: timeStr,
      };
    }

    // FALLBACK TYPE 1: Unstructured text
    return {
      id: Date.now() + Math.random(),
      type: 1,
      raw: clean,
      gol: clean,
      p: "-",
      l: "-",
      pot: "-",
      m2: "-",
      date: dateStr,
      time: timeStr,
    };
  }

  let lastScannedText = "";
  let lastScannedTime = 0;

  function addScannedItem(rawText) {
    // Mencegah scan ganda/duplikat dalam rentang 2 detik
    const now = Date.now();
    if (rawText === lastScannedText && now - lastScannedTime < 2000) {
      return;
    }
    lastScannedText = rawText;
    lastScannedTime = now;

    const item = parseBarcodeData(rawText);
    database.unshift(item);
    saveDatabase();

    // Feedback getar pada HP (jika didukung)
    if (navigator.vibrate) {
      navigator.vibrate(100);
    }

    Swal.fire({
      icon: "success",
      title: "Berhasil Terekam!",
      text: `[Barcode Type ${item.type}] - ${item.gol}`,
      timer: 1200,
      showConfirmButton: false,
    });
  }

  function inputManual() {
    const val = document.getElementById("manualData").value.trim();
    if (!val) return;
    addScannedItem(val);
    document.getElementById("manualData").value = "";
  }

  // --- SCANNER CAMERA ENGINE OPTIMIZED FOR HIGH-END & ALL PHONES ---
  function initZXing() {
    // Delay antarkupon decode diset ke 100ms agar sangat cepat dan tidak makan memori
    codeReader = new ZXing.BrowserMultiFormatReader(null, 100);
  }

  function toggleScan() {
    if (isScanning) {
      stopScan();
    } else {
      startScan();
    }
  }

  async function startScan() {
    if (!codeReader) initZXing();

    isScanning = true;
    const btn = document.getElementById("btnAction");
    btn.classList.add("stop");
    btn.innerHTML = `<i class="fas fa-stop" style="margin-right: 8px;"></i> STOP`;

    document.getElementById("placeholderMsg").style.display = "none";
    const videoElem = document.getElementById("videoElement");
    videoElem.style.display = "block";
    document.getElementById("targetBox").style.display = "block";
    document.getElementById("laser").style.display = "block";

    // KUNCI PERBAIKAN HP HIGH-END: Restriksi Resolusi Ideal ke HD (1280x720)
    // Mencegah HP kamera tinggi membebankan pemrosesan gambar 4K
    const constraints = {
      audio: false,
      video: {
        facingMode: { ideal: currentFacingMode },
        width: { min: 640, ideal: 1280, max: 1920 },
        height: { min: 480, ideal: 720, max: 1080 },
        frameRate: { ideal: 30, max: 60 },
        focusMode: { ideal: "continuous" }
      }
    };

    try {
      // Decode dari stream kamera yang sudah teroptimasi
      await codeReader.decodeFromConstraints(
        constraints,
        "videoElement",
        (result, err) => {
          if (result) {
            addScannedItem(result.getText());
          }
        }
      );
    } catch (err) {
      console.error("Gagal membuka kamera:", err);
      // Fallback jika constraints ketat gagal pada browser lama
      codeReader.decodeFromVideoDevice(
        undefined,
        "videoElement",
        (result, err) => {
          if (result) {
            addScannedItem(result.getText());
          }
        }
      );
    }
  }

  function stopScan() {
    isScanning = false;
    if (codeReader) codeReader.reset();

    const btn = document.getElementById("btnAction");
    btn.classList.remove("stop");
    btn.innerHTML = `<i class="fas fa-play" style="margin-right: 8px;"></i> MULAI`;

    document.getElementById("placeholderMsg").style.display = "flex";
    document.getElementById("videoElement").style.display = "none";
    document.getElementById("targetBox").style.display = "none";
    document.getElementById("laser").style.display = "none";
    isTorchOn = false;
    document.getElementById("btnTorch").classList.remove("active");
  }

  function switchCamera() {
    currentFacingMode =
      currentFacingMode === "environment" ? "user" : "environment";
    if (isScanning) {
      stopScan();
      startScan();
    }
  }

  function toggleTorch() {
    const videoTrack = document
      .getElementById("videoElement")
      ?.srcObject?.getVideoTracks()[0];
    if (videoTrack && videoTrack.getCapabilities().torch) {
      isTorchOn = !isTorchOn;
      videoTrack.applyConstraints({
        advanced: [{ torch: isTorchOn }],
      });
      document
        .getElementById("btnTorch")
        .classList.toggle("active", isTorchOn);
    } else {
      Swal.fire({
        icon: "info",
        title: "Senter Tidak Tersedia",
        text: "Fitur flash/senter tidak didukung pada perangkat ini.",
        timer: 2000,
        showConfirmButton: false,
      });
    }
  }

  // --- RENDERING TABLES ---
  function deleteRecord(id) {
    database = database.filter((x) => x.id !== id);
    saveDatabase();
    renderTodaySession();
    renderDatabase();
  }

  function renderTodaySession() {
    const todayStr = new Date().toISOString().split("T")[0];
    const todayItems = database.filter((x) => x.date === todayStr);

    // Barcode 1
    const b1 = todayItems.filter((x) => x.type === 1);
    document.getElementById("tableToday1").innerHTML = b1
      .map(
        (item, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td><span class="badge">${item.raw}</span></td>
        <td>${item.gol}</td>
        <td>${item.p}</td>
        <td>${item.l}</td>
        <td>${item.pot}</td>
        <td>${item.m2}</td>
        <td>${item.time}</td>
        <td><button class="btn-del" onclick="deleteRecord(${item.id})"><i class="fas fa-trash"></i></button></td>
      </tr>
    `
      )
      .join("");

    // Barcode 2
    const b2 = todayItems.filter((x) => x.type === 2);
    document.getElementById("tableToday2").innerHTML = b2
      .map(
        (item, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td><span class="badge">${item.raw}</span></td>
        <td>${item.gol}</td>
        <td>${item.len}</td>
        <td>${item.wide}</td>
        <td>${item.sht}</td>
        <td>${item.sm}</td>
        <td>${item.time}</td>
        <td><button class="btn-del" onclick="deleteRecord(${item.id})"><i class="fas fa-trash"></i></button></td>
      </tr>
    `
      )
      .join("");

    // Barcode 3
    const b3 = todayItems.filter((x) => x.type === 3);
    document.getElementById("tableToday3").innerHTML = b3
      .map(
        (item, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td><span class="badge">${item.raw}</span></td>
        <td>${item.gol}</td>
        <td>${item.len}</td>
        <td>${item.wide}</td>
        <td>${item.pcs}</td>
        <td>${item.m2}</td>
        <td>${item.time}</td>
        <td><button class="btn-del" onclick="deleteRecord(${item.id})"><i class="fas fa-trash"></i></button></td>
      </tr>
    `
      )
      .join("");
  }

  function renderDatabase() {
    const startDate = document.getElementById("start").value;
    const endDate = document.getElementById("end").value;
    const query = document.getElementById("search").value.toLowerCase();

    let filtered = database.filter((item) => {
      let matchDate = true;
      if (startDate) matchDate = matchDate && item.date >= startDate;
      if (endDate) matchDate = matchDate && item.date <= endDate;

      let matchSearch =
        !query ||
        item.raw.toLowerCase().includes(query) ||
        item.gol.toLowerCase().includes(query);

      return matchDate && matchSearch;
    });

    // Barcode 1
    const b1 = filtered.filter((x) => x.type === 1);
    document.getElementById("tableDb1").innerHTML = b1
      .map(
        (item, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td><span class="badge">${item.raw}</span></td>
        <td>${item.gol}</td>
        <td>${item.p}</td>
        <td>${item.l}</td>
        <td>${item.pot}</td>
        <td>${item.m2}</td>
        <td>${item.date}</td>
        <td>${item.time}</td>
        <td><button class="btn-del" onclick="deleteRecord(${item.id})"><i class="fas fa-trash"></i></button></td>
      </tr>
    `
      )
      .join("");

    // Barcode 2
    const b2 = filtered.filter((x) => x.type === 2);
    document.getElementById("tableDb2").innerHTML = b2
      .map(
        (item, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td><span class="badge">${item.raw}</span></td>
        <td>${item.gol}</td>
        <td>${item.len}</td>
        <td>${item.wide}</td>
        <td>${item.sht}</td>
        <td>${item.sm}</td>
        <td>${item.date}</td>
        <td>${item.time}</td>
        <td><button class="btn-del" onclick="deleteRecord(${item.id})"><i class="fas fa-trash"></i></button></td>
      </tr>
    `
      )
      .join("");

    // Barcode 3
    const b3 = filtered.filter((x) => x.type === 3);
    document.getElementById("tableDb3").innerHTML = b3
      .map(
        (item, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td><span class="badge">${item.raw}</span></td>
        <td>${item.gol}</td>
        <td>${item.len}</td>
        <td>${item.wide}</td>
        <td>${item.pcs}</td>
        <td>${item.m2}</td>
        <td>${item.date}</td>
        <td>${item.time}</td>
        <td><button class="btn-del" onclick="deleteRecord(${item.id})"><i class="fas fa-trash"></i></button></td>
      </tr>
    `
      )
      .join("");
  }

  // --- EXPORT LOGIC ---
  function exportExcelData(dataList, fileName) {
    const wb = XLSX.utils.book_new();

    const b1Data = dataList
      .filter((x) => x.type === 1)
      .map((x, i) => ({
        No: i + 1,
        Kode: x.raw,
        Golongan: x.gol,
        Panjang: x.p,
        Lebar: x.l,
        Potongan: x.pot,
        "M2": x.m2,
        Tanggal: x.date,
        Waktu: x.time,
      }));
    const ws1 = XLSX.utils.json_to_sheet(b1Data);
    XLSX.utils.book_append_sheet(wb, ws1, "Barcode 1");

    const b2Data = dataList
      .filter((x) => x.type === 2)
      .map((x, i) => ({
        No: i + 1,
        Kode: x.raw,
        Golongan: x.gol,
        "Panjang(LEN)": x.len,
        "Lebar(WIDE)": x.wide,
        "Potongan(SHT)": x.sht,
        "M2(SM)": x.sm,
        Tanggal: x.date,
        Waktu: x.time,
      }));
    const ws2 = XLSX.utils.json_to_sheet(b2Data);
    XLSX.utils.book_append_sheet(wb, ws2, "Barcode 2");

    const b3Data = dataList
      .filter((x) => x.type === 3)
      .map((x, i) => ({
        No: i + 1,
        Kode: x.raw,
        Golongan: x.gol,
        "Panjang(LEN)": x.len,
        "Lebar(WIDE)": x.wide,
        "Potongan(PCS)": x.pcs,
        "M2": x.m2,
        Tanggal: x.date,
        Waktu: x.time,
      }));
    const ws3 = XLSX.utils.json_to_sheet(b3Data);
    XLSX.utils.book_append_sheet(wb, ws3, "Barcode 3");

    XLSX.writeFile(wb, fileName);
  }

  function downloadExcelHarian() {
    const todayStr = new Date().toISOString().split("T")[0];
    const todayItems = database.filter((x) => x.date === todayStr);
    exportExcelData(todayItems, `Laporan_Harian_${todayStr}.xlsx`);
  }

  function downloadExcelMaster() {
    const todayStr = new Date().toISOString().split("T")[0];
    exportExcelData(database, `Laporan_Database_Master_${todayStr}.xlsx`);
  }

  function exportPDFData(dataList, fileName, titleText) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(14);
    doc.text("PT. DAYA SAKTI NIAGA", 14, 15);
    doc.setFontSize(10);
    doc.text(titleText, 14, 22);

    let currentY = 28;

    // Table Barcode 1
    const b1 = dataList.filter((x) => x.type === 1);
    if (b1.length > 0) {
      doc.text("Data Barcode 1", 14, currentY);
      doc.autoTable({
        startY: currentY + 3,
        head: [
          [
            "No",
            "Kode",
            "Golongan",
            "Panjang",
            "Lebar",
            "Pot",
            "M2",
            "Waktu",
          ],
        ],
        body: b1.map((x, i) => [
          i + 1,
          x.raw,
          x.gol,
          x.p,
          x.l,
          x.pot,
          x.m2,
          `${x.date} ${x.time}`,
        ]),
      });
      currentY = doc.lastAutoTable.finalY + 10;
    }

    // Table Barcode 2
    const b2 = dataList.filter((x) => x.type === 2);
    if (b2.length > 0) {
      doc.text("Data Barcode 2", 14, currentY);
      doc.autoTable({
        startY: currentY + 3,
        head: [
          [
            "No",
            "Kode",
            "Golongan",
            "LEN",
            "WIDE",
            "SHT",
            "SM",
            "Waktu",
          ],
        ],
        body: b2.map((x, i) => [
          i + 1,
          x.raw,
          x.gol,
          x.len,
          x.wide,
          x.sht,
          x.sm,
          `${x.date} ${x.time}`,
        ]),
      });
      currentY = doc.lastAutoTable.finalY + 10;
    }

    // Table Barcode 3
    const b3 = dataList.filter((x) => x.type === 3);
    if (b3.length > 0) {
      doc.text("Data Barcode 3", 14, currentY);
      doc.autoTable({
        startY: currentY + 3,
        head: [
          [
            "No",
            "Kode",
            "Golongan",
            "LEN",
            "WIDE",
            "PCS",
            "M2",
            "Waktu",
          ],
        ],
        body: b3.map((x, i) => [
          i + 1,
          x.raw,
          x.gol,
          x.len,
          x.wide,
          x.pcs,
          x.m2,
          `${x.date} ${x.time}`,
        ]),
      });
    }

    doc.save(fileName);
  }

  function downloadPDFHarian() {
    const todayStr = new Date().toISOString().split("T")[0];
    const todayItems = database.filter((x) => x.date === todayStr);
    exportPDFData(
      todayItems,
      `Laporan_Harian_${todayStr}.pdf`,
      `Laporan Harian - Tanggal: ${todayStr}`
    );
  }

  function downloadPDFMaster() {
    const todayStr = new Date().toISOString().split("T")[0];
    exportPDFData(
      database,
      `Laporan_Database_Master_${todayStr}.pdf`,
      `Laporan Master Database - Dibuat: ${todayStr}`
    );
  }

  function clearAllData() {
    Swal.fire({
      title: "Konfirmasi Reset",
      text: "Apakah Anda yakin ingin menghapus SELURUH data database? Tindakan ini tidak dapat dibatalkan!",
      icon: "warning",
      showCancelButton: true,
      confirmButtonColor: "#e11d48",
      cancelButtonColor: "#64748b",
      confirmButtonText: "Ya, Hapus Semua!",
      cancelButtonText: "Batal",
    }).then((result) => {
      if (result.isConfirmed) {
        database = [];
        saveDatabase();
        renderTodaySession();
        renderDatabase();
        Swal.fire("Terhapus!", "Database telah dikosongkan.", "success");
      }
    });
  }

  // --- PULL TO REFRESH LOGIC ---
  let touchStartY = 0;
  const pullIndicator = document.getElementById("pullIndicator");

  window.addEventListener(
    "touchstart",
    (e) => {
      touchStartY = e.touches[0].clientY;
    },
    { passive: true }
  );

  window.addEventListener(
    "touchmove",
    (e) => {
      const touchY = e.touches[0].clientY;
      const diff = touchY - touchStartY;
      if (window.scrollY === 0 && diff > 80) {
        pullIndicator.style.opacity = "1";
      }
    },
    { passive: true }
  );

  window.addEventListener("touchend", (e) => {
    if (parseFloat(pullIndicator.style.opacity) > 0.8) {
      pullIndicator.style.opacity = "0";
      location.reload();
    } else {
      pullIndicator.style.opacity = "0";
    }
  });

  // Initialize
  window.onload = () => {
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("start").value = today;
    document.getElementById("end").value = today;
  };
</script>
