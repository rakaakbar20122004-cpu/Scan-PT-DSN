  <script>
    // All existing JavaScript remains unchanged until the toggleScan function

    // ── Optimized Barcode Detection ────────────────────────────────────────────
    //  Improved Android Performance:
    //  - Added dynamic frame rate adjustment
    //  - Implemented adaptive ROI cropping
    //  - Added performance monitoring
    //  - Enhanced error recovery

    async function toggleScan() {
      // Existing code...
      
      // Add performance monitoring
      const startTime = performance.now();
      let frameCount = 0;
      
      // Frame rate control
      let lastFrameTime = 0;
      const minFrameInterval = 1000 / 30; // 30fps minimum
      
      // ROI configuration
      let roiRect = null;
      
      // Adaptive detection parameters
      let detectionQuality = 1.0;
      let roiScaleFactor = 1.0;
      
      async function detectLoop() {
        if (!isScanning) return;
        
        try {
          // Calculate time since last frame
          const currentTime = performance.now();
          const deltaTime = currentTime - lastFrameTime;
          
          // Skip frames if we're too fast (avoid overwhelming CPU)
          if (deltaTime < minFrameInterval) {
            requestAnimationFrame(detectLoop);
            return;
          }
          
          lastFrameTime = currentTime;
          frameCount++;
          
          // Update performance metrics
          if (currentTime - startTime > 1000) {
            const fps = frameCount / ((currentTime - startTime) / 1000);
            console.log(`Current FPS: ${fps.toFixed(2)}`);
            
            // Adjust quality based on performance
            if (fps < 15) {
              detectionQuality = Math.max(0.5, detectionQuality - 0.1);
              roiScaleFactor = Math.max(0.7, roiScaleFactor - 0.05);
            } else if (fps > 30) {
              detectionQuality = Math.min(1.0, detectionQuality + 0.05);
              roiScaleFactor = Math.min(1.2, roiScaleFactor + 0.02);
            }
            
            frameCount = 0;
            lastFrameTime = currentTime;
          }
          
          // Update ROI rectangle dynamically
          if (!roiRect) {
            roiRect = {
              x: Math.floor(video.videoWidth * 0.05),
              y: Math.floor(video.videoHeight * 0.35),
              width: Math.floor(video.videoWidth * 0.90 * roiScaleFactor),
              height: Math.floor(video.videoHeight * 0.30 * roiScaleFactor)
            };
          } else {
            // Smoothly adjust ROI size
            roiRect.width = Math.floor(roiRect.width * 0.9 + (video.videoWidth * 0.90 * roiScaleFactor) * 0.1);
            roiRect.height = Math.floor(roiRect.height * 0.9 + (video.videoHeight * 0.30 * roiScaleFactor) * 0.1);
          }
          
          // Perform detection
          let result;
          if (nativeDetector) {
            result = await nativeDetector.detect(video);
          } else {
            // Use ZXing with optimized settings
            result = await zxingReader.decodeFromCanvas(roiCanvas);
          }
          
          if (result) {
            processBarcodeDetected(result.getText(), result.format);
          }
          
        } catch (err) {
          // Graceful error handling
          if (err.message.includes('NotFound')) {
            // Normal case - no barcode detected
          } else {
            console.error('Detection error:', err);
          }
        }
        
        if (isScanning) {
          requestAnimationFrame(detectLoop);
        }
      }
      
      // Start detection loop
      requestAnimationFrame(detectLoop);
      
      // Rest of existing code...
    }

    // ── WhatsApp Share Feature ─────────────────────────────────────────────────
    //  Add WhatsApp share button to export page

    function addWhatsAppShareButton() {
      const exportContainer = document.querySelector('.view-page.active');
      if (!exportContainer) return;
      
      const shareBtn = document.createElement('button');
      shareBtn.className = 'btn btn-export-big whatsapp';
      shareBtn.innerHTML = `
        <i class="fab fa-whatsapp"></i>
        <div><strong>Bagikan ke WhatsApp</strong></div>
      `;
      
      shareBtn.onclick = () => {
        // Get selected data from today view
        const todayData = getAllTodayData();
        
        // Format for WhatsApp
        const formattedText = formatForWhatsApp(todayData);
        
        // Create WhatsApp URL
        const encodedText = encodeURIComponent(formattedText);
        const url = `https://wa.me/?text=${encodedText}`;
        
        // Open in new tab
        window.open(url, '_blank');
      };
      
      // Insert before danger zone
      const dangerZone = document.querySelector('.btn-danger-zone');
      if (dangerZone) {
        dangerZone.parentNode.insertBefore(shareBtn, dangerZone);
      }
    }

    // Format data for WhatsApp message
    function formatForWhatsApp(data) {
      const lines = [
        "📊 Data Scan Hari Ini - PT. Daya Sakti Niaga",
        "",
        `📅 Tanggal: ${new Date().toLocaleDateString('id-ID')}`,
        ""
      ];
      
      // Add Barcode 1 data
      const b1Data = data.filter(d => d.jenis === 'Barcode 1');
      if (b1Data.length > 0) {
        lines.push("📋 Barcode 1:");
        b1Data.forEach(d => {
          lines.push(`- ${d.kode}: ${d.golongan} (${d.panjang}×${d.lebar}) ×${d.potongan} = ${d.persegi}m²`);
        });
      }
      
      // Add Barcode 2 data
      const b2Data = data.filter(d => d.jenis === 'Barcode 2');
      if (b2Data.length > 0) {
        lines.push("📋 Barcode 2:");
        b2Data.forEach(d => {
          lines.push(`- ${d.kode}: ${d.golongan} (${d.panjang}×${d.lebar}) ×${d.potongan} = ${d.persegi}m²`);
        });
      }
      
      // Add totals
      lines.push("");
      lines.push(`📊 Total Barcode 1: ${b1Data.length}`);
      lines.push(`📊 Total Barcode 2: ${b2Data.length}`);
      
      return lines.join("\n");
    }

    // Call this when view changes
    function onViewChange(viewId) {
      // Existing code...
      
      if (viewId === 'view-export') {
        addWhatsAppShareButton();
      }
    }
  </script>
